# Push a tag vX.Y.Z (matching manifest.json and a "## X.Y.Z" CHANGELOG section)
# and this downloads every block list, compiles them, packages the extension,
# makes the GitHub release, and, once each store is configured, uploads and
# submits it to the Chrome Web Store and to addons.mozilla.org. There is a zip
# per browser: tools/package.py derives the Firefox manifest from the
# Chromium one in the repository.
#
# Chrome Web Store (skipped until all three exist):
#   secret   CWS_SERVICE_ACCOUNT_KEY  JSON key of the service account linked in the dashboard
#   variable CWS_PUBLISHER_ID         Developer Dashboard > Publisher > Settings
#   variable CWS_EXTENSION_ID         the item's 32-letter ID
#
# addons.mozilla.org (skipped until both exist):
#   secret   AMO_JWT_ISSUER           Developer Hub > Tools > Manage API Keys
#   secret   AMO_JWT_SECRET           same page

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest."
            exit 1
          fi
          # Chrome Web Store limits, checked here so the upload is not where we find out.
          desc_len=$(jq -r '.description | length' manifest.json)
          name_len=$(jq -r '.name | length' manifest.json)
          if [ "$desc_len" -gt 132 ] || [ "$name_len" -gt 75 ]; then
            echo "::error::manifest.json description is $desc_len chars (max 132), name is $name_len (max 75)."
            exit 1
          fi
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/bulle-block-$version-chrome.zip" >> "$GITHUB_OUTPUT"
          echo "ffzip=dist/bulle-block-$version-firefox.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Fresh lists on every release: the rules are generated, never committed.
      # This also rewrites manifest.json's rule_resources to match today's sizes.
      - name: Compile block lists
        run: python tools/build_rules.py

      - name: Package
        run: |
          python tools/package.py
          unzip -l "${{ steps.v.outputs.zip }}"

      # Mozilla's linter, the same one AMO runs on upload. Fails only on errors.
      - name: Firefox lint
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - name: GitHub release
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.v.outputs.zip }}" "${{ steps.v.outputs.ffzip }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.v.outputs.zip }}" "${{ steps.v.outputs.ffzip }}" \
              --title "${{ steps.v.outputs.version }}" --notes-file notes.md
          fi

      - name: Chrome Web Store
        env:
          KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          ITEM: ${{ vars.CWS_EXTENSION_ID }}
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUBLISHER" ] || [ -z "$ITEM" ]; then
            echo "::notice::Chrome Web Store is not configured; skipped. The zip is on the GitHub release."
            exit 0
          fi
          set -euo pipefail

          # Service account JWT -> access token, no third-party action.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          email=$(jq -r .client_email <<<"$KEY")
          jq -r .private_key <<<"$KEY" > key.pem
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          claims=$(jq -nc --arg iss "$email" --argjson iat "$now" '{
            iss: $iss, scope: "https://www.googleapis.com/auth/chromewebstore",
            aud: "https://oauth2.googleapis.com/token", iat: $iat, exp: ($iat + 600)
          }' | b64url)
          sig=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign key.pem | b64url)
          rm key.pem
          token=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            -d assertion="$header.$claims.$sig" | jq -r .access_token)
          echo "::add-mask::$token"

          api=https://chromewebstore.googleapis.com
          item="publishers/$PUBLISHER/items/$ITEM"
          auth="Authorization: Bearer $token"

          echo "Uploading $ZIP"
          upload=$(curl -sS --fail-with-body -X POST -H "$auth" \
            -H 'Content-Type: application/zip' --data-binary "@$ZIP" \
            "$api/upload/v2/$item:upload")
          echo "$upload"
          state=$(jq -r .uploadState <<<"$upload")
          for _ in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || [ "$state" = "UPLOAD_IN_PROGRESS" ] || break
            sleep 10
            state=$(curl -sS --fail-with-body -H "$auth" "$api/v2/$item:fetchStatus" | jq -r .lastAsyncUploadState)
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Upload ended in state $state."
            exit 1
          fi

          echo "Submitting for review"
          publish=$(curl -sS --fail-with-body -X POST -H "$auth" \
            -H 'Content-Type: application/json' -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "$api/v2/$item:publish")
          echo "$publish"
          echo "::notice::Submitted to the Chrome Web Store: $(jq -r .state <<<"$publish"). It goes live when review passes."

      - name: Firefox Add-ons
        # Runs even if the Chrome Web Store step failed; the stores are independent.
        if: ${{ !cancelled() && steps.gh.outcome == 'success' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::addons.mozilla.org is not configured; skipped. The Firefox zip is on the GitHub release."
            exit 0
          fi
          set -euo pipefail
          # Listed channel: AMO signs it and queues it for review. The metadata
          # (summary, category, licence) only matters when the add-on is new.
          npx --yes web-ext@8 sign --source-dir dist/firefox --channel listed \
            --amo-metadata docs/store/amo-metadata.json \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          echo "::notice::Submitted to addons.mozilla.org. It goes live when review passes."
